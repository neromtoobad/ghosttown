[package]
name = "ghosttown-specimen"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Builds the practice table's specimen deal transaction. Uses chit-core to make the chits.
[dependencies]
chit-core = { path = "../../chit/core" }
orchard = { version = "0.16", default-features = false, features = ["std", "circuit"] }
zcash_primitives = { version = "0.31", default-features = false, features = ["std"] }
zcash_protocol = "0.11"
zcash_keys = { version = "0.17", default-features = false, features = ["orchard", "sapling", "std", "test-dependencies"] }
rand = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
